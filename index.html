<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena · Kowadło</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --panel: #12161f;
    --line: #262b37;
    --gold: #c8aa6e;
    --gold-dim: #785a28;
    --text: #f0e6d2;
    --text-2: #a09b8c;
    --muted: #6b6a66;
    --win: #0ac8b9;
    --now: #d8d2c2;

    /* kolory jak w LoL (ikonki zastępcze) */
    --i-ad: #f0892e; --i-ap: #6f8cff; --i-armor: #e8c35a; --i-mr: #a07cff;
    --i-hp: #3cc05a; --i-leth: #e5533f; --i-mpen: #b26bf0; --i-dr: #9aa3b5;

    /* kolory linii na wykresie (sprawdzone pod daltonizm na ciemnym tle) */
    --c-dmg-phys: #d06f1a; --c-flat-phys: #c04fc0;
    --c-dmg-mag:  #4f86e8; --c-flat-mag:  #c75bb0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1000px 500px at 50% -200px, #1a2233 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4;
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }

  /* ---------- góra ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-family: Cinzel, serif; color: var(--gold); margin: 0; font-size: 26px; letter-spacing: .04em; }
  .seg { display: inline-flex; background: #0b0e14; border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button {
    display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text-2);
    font: inherit; font-weight: 600; font-size: 14px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .seg button.on { background: #1d2331; color: var(--text); box-shadow: inset 0 0 0 1px var(--gold-dim); }
  .seg .dot { width: 10px; height: 10px; border-radius: 50%; }
  .toggles { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- panele ---------- */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .panel {
    background: linear-gradient(180deg, #171c27, var(--panel));
    border: 1px solid var(--line); border-top: 2px solid var(--gold-dim); border-radius: 8px; padding: 16px;
  }
  .ptitle { font-family: Cinzel, serif; color: var(--gold); font-size: 14px; letter-spacing: .08em; margin: 0 0 12px; }

  /* ---------- ikonki ---------- */
  .ic { width: 24px; height: 24px; flex: 0 0 24px; display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .ic img, .ic svg { width: 100%; height: 100%; object-fit: contain; }
  .ic.sm { width: 16px; height: 16px; flex-basis: 16px; }
  .ic.lg { width: 30px; height: 30px; flex-basis: 30px; }
  .ic.pct::after {
    content: "%"; position: absolute; right: -6px; bottom: -5px; font-size: 10px; font-weight: 700;
    color: var(--text); background: var(--bg); border-radius: 3px; padding: 0 2px; line-height: 1.2;
  }
  .pair { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; flex: 0 0 auto; }
  .pair .slash { color: var(--muted); font-weight: 300; font-size: 18px; margin: 0 1px; }
  .pair .off { opacity: .28; filter: grayscale(.6); }

  /* ---------- suwaki ---------- */
  .row { display: grid; grid-template-columns: 64px 1fr 76px; gap: 10px; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .row .solo { display: flex; justify-content: center; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  input[type=number] {
    width: 76px; background: #0b0e14; color: var(--text); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 8px; font: inherit; font-variant-numeric: tabular-nums; text-align: right;
  }
  input[type=number]:focus { outline: 1px solid var(--gold); border-color: var(--gold); }

  /* ---------- werdykt ---------- */
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 10px; }
  .vs .or { align-self: center; color: var(--muted); font-size: 13px; font-weight: 600; }
  .opt {
    background: #0d1118; border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: center;
    transition: border-color .15s, box-shadow .15s;
  }
  .opt .what { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 16px; color: var(--text-2); }
  .opt .gain { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; color: var(--text-2); }
  .opt.best { border-color: var(--win); box-shadow: 0 0 0 1px var(--win) inset, 0 0 24px -8px var(--win); }
  .opt.best .gain { color: var(--text); }
  .opt.best .what { color: var(--text); }
  .opt .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--win); height: 14px; margin-top: 2px; }

  /* ---------- wykres ---------- */
  .chart-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .big small { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 6px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #0b0e14; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .pill.up { color: #5fd38d; } .pill.down { color: #ef7a6b; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin: 6px 0 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
  .chart-box { position: relative; }
  .chart-box svg { width: 100%; height: auto; display: block; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none; background: #05070b; border: 1px solid var(--gold-dim); border-radius: 5px;
    padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; font-variant-numeric: tabular-nums;
  }
  .tip .r { display: flex; align-items: center; gap: 6px; }
  .tip i { width: 10px; height: 0; border-top: 2px solid; display: inline-block; }
  .cross { font-size: 13px; color: var(--text-2); margin-top: 6px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .cross b { color: var(--text); }

  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
  .anv { display: grid; grid-template-columns: auto repeat(2, 76px); gap: 6px 10px; align-items: center; margin-top: 10px; font-size: 13px; }
  .anv .h { color: var(--text-2); font-weight: 600; text-align: right; }

  footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>Arena · Kowadło</h1>
    <div class="toggles">
      <div class="seg" id="seg-mode">
        <button data-v="phys"><span class="ic sm" data-icon="ad"></span>Fizyczne</button>
        <button data-v="mag"><span class="ic sm" data-icon="ap"></span>Magiczne</button>
      </div>
      <div class="seg" id="seg-tier">
        <button data-v="silver"><span class="dot" style="background:#a7adb8"></span>Szare</button>
        <button data-v="gold"><span class="dot" style="background:#e2b84a"></span>Złote</button>
      </div>
    </div>
  </div>

  <div class="grid2">
    <section class="panel">
      <div class="ptitle">ATAKUJĄCY</div>
      <div id="atk-rows"></div>
    </section>
    <section class="panel">
      <div class="ptitle">CEL</div>
      <div id="def-rows"></div>
    </section>
  </div>

  <div class="grid2" style="margin-top:14px">
    <section class="panel">
      <div class="ptitle">KOWADŁO · ATAK</div>
      <div class="vs" id="vs-atk"></div>
    </section>
    <section class="panel">
      <div class="ptitle">KOWADŁO · OBRONA</div>
      <div class="vs" id="vs-def"></div>
    </section>
  </div>

  <section class="panel" style="margin-top:14px">
    <div class="chart-head">
      <div class="big" id="big"></div>
      <div class="pills" id="pills"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-box" id="chart"></div>
    <div class="cross" id="cross"></div>

    <details>
      <summary>Wartości kowadeł</summary>
      <div class="anv" id="anv"></div>
    </details>
  </section>

  <footer>
    Nieoficjalny kalkulator fanowski, niezwiązany z Riot Games. League of Legends jest znakiem towarowym Riot Games, Inc. Ikonki: League of Legends Wiki.
  </footer>
</div>

<script>
/* =====================================================================
   IKONKI – najpierw LoL Wiki, potem folder icons/, na końcu własne SVG
   ===================================================================== */
const WIKI = 'https://wiki.leagueoflegends.com/en-us/images/';
const ICONS = {
  ad:    { name: 'AD',                         src: [WIKI + 'Attack_damage_icon.svg', 'icons/ad.png'],          color: 'var(--i-ad)' },
  ap:    { name: 'AP',                         src: [WIKI + 'Ability_power_icon.svg', 'icons/ap.png'],          color: 'var(--i-ap)' },
  leth:  { name: 'Lethality',                  src: [WIKI + 'Armor_penetration_icon.svg', 'icons/lethality.png'], color: 'var(--i-leth)' },
  mpen:  { name: 'Przebicie odporności na magię', src: [WIKI + 'Magic_penetration_icon.svg', 'icons/magicpen.png'], color: 'var(--i-mpen)' },
  apenp: { name: '% przebicia pancerza',       src: [WIKI + 'Armor_penetration_icon.svg', 'icons/lethality.png'], color: 'var(--i-leth)', pct: true },
  mpenp: { name: '% przebicia odporności na magię', src: [WIKI + 'Magic_penetration_icon.svg', 'icons/magicpen.png'], color: 'var(--i-mpen)', pct: true },
  hp:    { name: 'Zdrowie',                    src: [WIKI + 'Health_icon.png', 'icons/health.png'],            color: 'var(--i-hp)' },
  armor: { name: 'Pancerz',                    src: [WIKI + 'Armor_icon.svg', 'icons/armor.png'],              color: 'var(--i-armor)' },
  mr:    { name: 'Odporność na magię',         src: [WIKI + 'Magic_resistance_icon.svg', 'icons/mr.png'],      color: 'var(--i-mr)' },
  dr:    { name: 'Redukcja obrażeń (np. Exhaust, Anathema\'s Chains)', src: [],                            color: 'var(--i-dr)' },
};
const SVG = {
  ad:    '<path d="M19 3h2v2l-9.5 9.5-2-2z" fill="currentColor"/><path d="M8 13l3 3-1.5 1.5-1-1L5 20l-1-1 3.5-3.5-1-1z" fill="currentColor"/>',
  ap:    '<path d="M12 2l2.6 6.9L22 9.3l-5.8 4.6 2 7.1L12 17l-6.2 4 2-7.1L2 9.3l7.4-.4z" fill="currentColor"/>',
  leth:  '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 18L18 6" stroke="currentColor" stroke-width="2.5"/>',
  apenp: '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 18L18 6" stroke="currentColor" stroke-width="2.5"/>',
  mpen:  '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 19L19 5" stroke="currentColor" stroke-width="2.5"/>',
  mpenp: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 19L19 5" stroke="currentColor" stroke-width="2.5"/>',
  hp:    '<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor"/>',
  armor: '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="currentColor"/>',
  mr:    '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="currentColor"/><path d="M12 7l1.5 3.5L17 12l-3.5 1.5L12 17l-1.5-3.5L7 12l3.5-1.5z" fill="#0a0d13"/>',
  dr:    '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v9m-4-4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/>',
};
function ic(key, size = '', extra = '') {
  return `<span class="ic ${size} ${ICONS[key].pct ? 'pct' : ''} ${extra}" data-icon="${key}" title="${ICONS[key].name}"></span>`;
}
const RESOLVED = {}; // zapamiętane: który adres ikonki działa (albo 'svg')
function paintIcon(el, key, src) {
  const def = ICONS[key];
  if (src === 'svg') {
    el.innerHTML = `<svg viewBox="0 0 24 24" style="color:${def.color}" aria-hidden="true">${SVG[key]}</svg>`;
  } else {
    el.innerHTML = `<img src="${src}" alt="${def.name}">`;
  }
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]:not([data-done])').forEach(el => {
    el.dataset.done = '1';
    const key = el.dataset.icon, def = ICONS[key];
    if (RESOLVED[key]) { paintIcon(el, key, RESOLVED[key]); return; }
    const next = i => {
      if (i >= def.src.length) { RESOLVED[key] = 'svg'; paintIcon(el, key, 'svg'); return; }
      const img = new Image();
      img.onload = () => { RESOLVED[key] = def.src[i]; paintIcon(el, key, def.src[i]); };
      img.onerror = () => next(i + 1);
      img.src = def.src[i];
    };
    next(0);
  });
}

/* =====================================================================
   DANE
   Wartości kowadeł z LoL Wiki (Stat Bonus (Arena)). Można je zmienić na stronie.
   ===================================================================== */
const ANVIL = {
  silver: { ad: 15, leth: 15, ap: 25, mpen: 15, hp: 150, armor: 15, mr: 15 },
  gold:   { ad: 35, leth: 20, ap: 50, mpen: 18, hp: 375, armor: 45, mr: 45 },
};
// jakie statystyki są „w grze” w danym trybie
const MODE = {
  phys: { dmg: 'ad', flat: 'leth', pct: 'apenp', res: 'armor', cDmg: 'var(--c-dmg-phys)', cFlat: 'var(--c-flat-phys)' },
  mag:  { dmg: 'ap', flat: 'mpen', pct: 'mpenp', res: 'mr',    cDmg: 'var(--c-dmg-mag)',  cFlat: 'var(--c-flat-mag)' },
};
const PAIR = { dmg: ['ad', 'ap'], flat: ['leth', 'mpen'], pct: ['apenp', 'mpenp'], res: ['armor', 'mr'] };

const state = {
  mode: 'phys', tier: 'gold',
  phys: { dmg: 200, flat: 10, pct: 0, res: 120 },
  mag:  { dmg: 300, flat: 10, pct: 0, res: 90 },
  hp: 3000, dr: 0,
};
const LIMITS = {
  dmg: [0, 800, 1], flat: [0, 80, 1], pct: [0, 70, 0.5], res: [0, 400, 1], hp: [500, 8000, 10], dr: [0, 80, 1],
};

/* =====================================================================
   MATEMATYKA – tak samo dla pancerza i odporności na magię
   ===================================================================== */
// najpierw % przebicia, potem płaskie (lethality / magic pen); nie niżej niż 0
function effRes(res, pct, flat) {
  if (res <= 0) return res;
  return Math.max(0, res * (1 - Math.min(pct, 100) / 100) - Math.max(flat, 0));
}
function mult(r) { return r >= 0 ? 100 / (100 + r) : 2 - 100 / (100 - r); }
// obrażenia jednego ciosu o skalowaniu 100%
function hit(dmg, flat, pct, res, dr) { return dmg * mult(effRes(res, pct, flat)) * (1 - dr / 100); }
function ehp(hp, res, pct, flat, dr) { return hp / (mult(effRes(res, pct, flat)) * (1 - Math.min(dr, 99) / 100)); }

/* =====================================================================
   UI
   ===================================================================== */
const SHORT = { ad: 'AD', ap: 'AP', leth: 'Lethality', mpen: 'Magic Pen', armor: 'Pancerz', mr: 'MR' };
const cur = () => state[state.mode];
const M = () => MODE[state.mode];
const nf0 = new Intl.NumberFormat('pl-PL', { maximumFractionDigits: 0 });
const pct = x => (x >= 0 ? '+' : '−') + new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Math.abs(x * 100)) + '%';

function pairHTML(slot) {
  const [p, m] = PAIR[slot];
  const on = state.mode === 'phys' ? p : m;
  return `<span class="pair" data-toggle title="Przełącz fizyczne / magiczne">
    ${ic(p, '', on === p ? '' : 'off')}<span class="slash">/</span>${ic(m, '', on === m ? '' : 'off')}</span>`;
}
function rowHTML(id, iconHTML, slot) {
  const [min, max, step] = LIMITS[slot];
  return `<div class="row">
    ${iconHTML}
    <input type="range" id="rg-${id}" min="${min}" max="${max}" step="${step}">
    <input type="number" id="in-${id}" step="${step}">
  </div>`;
}
function buildRows() {
  document.getElementById('atk-rows').innerHTML =
    rowHTML('dmg', pairHTML('dmg'), 'dmg') +
    rowHTML('flat', pairHTML('flat'), 'flat') +
    rowHTML('pct', pairHTML('pct'), 'pct');
  document.getElementById('def-rows').innerHTML =
    rowHTML('hp', `<span class="solo">${ic('hp')}</span>`, 'hp') +
    rowHTML('res', pairHTML('res'), 'res') +
    rowHTML('dr', `<span class="solo">${ic('dr')}</span>`, 'dr');

  const getter = id => (id === 'hp' || id === 'dr') ? state[id] : cur()[id];
  const setter = (id, v) => { if (id === 'hp' || id === 'dr') state[id] = v; else cur()[id] = v; };
  ['dmg', 'flat', 'pct', 'hp', 'res', 'dr'].forEach(id => {
    const rg = document.getElementById('rg-' + id), num = document.getElementById('in-' + id);
    rg.value = num.value = getter(id);
    rg.addEventListener('input', () => { setter(id, +rg.value); num.value = rg.value; render(); });
    num.addEventListener('input', () => {
      const v = parseFloat(num.value);
      if (!isNaN(v)) { setter(id, v); rg.value = v; render(); }
    });
  });
  document.querySelectorAll('[data-toggle]').forEach(el =>
    el.addEventListener('click', () => setMode(state.mode === 'phys' ? 'mag' : 'phys')));
  hydrateIcons();
}
function setMode(m) { state.mode = m; syncSeg(); buildRows(); render(); }
function syncSeg() {
  document.querySelectorAll('#seg-mode button').forEach(b => b.classList.toggle('on', b.dataset.v === state.mode));
  document.querySelectorAll('#seg-tier button').forEach(b => b.classList.toggle('on', b.dataset.v === state.tier));
}

function vsHTML(a, b) {
  const tie = Math.abs(a.gain - b.gain) < 0.0005;
  const card = (o, best) => `<div class="opt ${best ? 'best' : ''}">
      <div class="what">${ic(o.icon, 'lg')}+${nf0.format(o.amount)}</div>
      <div class="gain">${pct(o.gain)}</div>
      <div class="tag">${best ? (tie ? 'REMIS' : 'BIERZ') : ''}</div>
    </div>`;
  return card(a, tie || a.gain > b.gain) + `<div class="or">vs</div>` + card(b, tie || b.gain > a.gain);
}

function render() {
  const s = cur(), m = M(), A = ANVIL[state.tier];
  const base = hit(s.dmg, s.flat, s.pct, s.res, state.dr);

  // --- atak ---
  const aDmg  = { icon: m.dmg,  amount: A[m.dmg],  gain: base > 0 ? hit(s.dmg + A[m.dmg], s.flat, s.pct, s.res, state.dr) / base - 1 : 0 };
  const aFlat = { icon: m.flat, amount: A[m.flat], gain: base > 0 ? hit(s.dmg, s.flat + A[m.flat], s.pct, s.res, state.dr) / base - 1 : 0 };
  document.getElementById('vs-atk').innerHTML = vsHTML(aDmg, aFlat);

  // --- obrona (przeciwko przebiciu atakującego) ---
  const e0 = ehp(state.hp, s.res, s.pct, s.flat, state.dr);
  const dHp  = { icon: 'hp',  amount: A.hp,    gain: ehp(state.hp + A.hp, s.res, s.pct, s.flat, state.dr) / e0 - 1 };
  const dRes = { icon: m.res, amount: A[m.res], gain: ehp(state.hp, s.res + A[m.res], s.pct, s.flat, state.dr) / e0 - 1 };
  document.getElementById('vs-def').innerHTML = vsHTML(dHp, dRes);

  // --- nagłówek wykresu ---
  const noPen = hit(s.dmg, 0, 0, s.res, state.dr);
  const noDr  = hit(s.dmg, s.flat, s.pct, s.res, 0);
  const hits  = base > 0 ? Math.ceil(state.hp / base) : '∞';
  document.getElementById('big').innerHTML = `${nf0.format(base)}<small>obrażeń / cios · ${hits} ciosów</small>`;
  let pills = '';
  if (noPen > 0 && base / (noPen) - 1 > 0.0005 && (s.flat > 0 || s.pct > 0))
    pills += `<span class="pill up">${ic(m.flat, 'sm')}${ic(m.pct, 'sm')} ${pct(hit(s.dmg, s.flat, s.pct, s.res, 0) / hit(s.dmg, 0, 0, s.res, 0) - 1)}</span>`;
  if (state.dr > 0 && noDr > 0)
    pills += `<span class="pill down">${ic('dr', 'sm')} ${pct(base / noDr - 1)}</span>`;
  document.getElementById('pills').innerHTML = pills;

  renderChart(s, m, A);
  hydrateIcons();
}

/* =====================================================================
   WYKRES: obrażenia na cios w zależności od pancerza / MR celu
   ===================================================================== */
function renderChart(s, m, A) {
  const boxW = document.getElementById('chart').clientWidth || 900;
  const W = Math.max(300, boxW), H = W < 600 ? 240 : 300, pad = { l: 42, r: 10, t: 12, b: 28 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const xMax = Math.max(300, Math.ceil(s.res * 1.3 / 50) * 50);
  const xs = []; for (let r = 0; r <= xMax; r += 2) xs.push(r);

  const series = [
    { key: 'nopen', color: '#5a5f6b', dash: '5 5', label: 'bez przebicia', f: r => hit(s.dmg, 0, 0, r, state.dr) },
    { key: 'now',   color: 'var(--now)', label: 'teraz',                     f: r => hit(s.dmg, s.flat, s.pct, r, state.dr) },
    { key: 'dmg',   color: m.cDmg,  icon: m.dmg,  amount: A[m.dmg],  f: r => hit(s.dmg + A[m.dmg], s.flat, s.pct, r, state.dr) },
    { key: 'flat',  color: m.cFlat, icon: m.flat, amount: A[m.flat], f: r => hit(s.dmg, s.flat + A[m.flat], s.pct, r, state.dr) },
  ];
  series.forEach(se => se.pts = xs.map(r => se.f(r)));

  const yMaxRaw = Math.max(1, ...series.flatMap(se => se.pts));
  const yStep = niceStep(yMaxRaw * 1.05 / 4), yMax = yStep * Math.ceil(yMaxRaw * 1.05 / yStep);
  const X = r => pad.l + r / xMax * iw;
  const Y = v => pad.t + ih - Math.max(0, v) / yMax * ih;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Obrażenia na cios w zależności od pancerza celu">`;
  for (let v = 0; v <= yMax + 1e-9; v += yStep) {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#20252f"/>`;
    svg += `<text x="${pad.l - 8}" y="${Y(v) + 4}" fill="#6b6a66" font-size="12" text-anchor="end">${nf0.format(v)}</text>`;
  }
  for (let r = 0; r <= xMax; r += (W < 600 ? 100 : 50))
    svg += `<text x="${X(r)}" y="${H - 8}" fill="#6b6a66" font-size="12" text-anchor="middle">${r}</text>`;

  // obszar zysku z przebicia
  const now = series[1], np = series[0];
  let area = xs.map((r, i) => `${i ? 'L' : 'M'}${X(r).toFixed(1)},${Y(now.pts[i]).toFixed(1)}`).join('');
  area += xs.slice().reverse().map((r, j) => `L${X(r).toFixed(1)},${Y(np.pts[xs.length - 1 - j]).toFixed(1)}`).join('') + 'Z';
  svg += `<path d="${area}" fill="var(--now)" opacity=".07"/>`;

  // znacznik celu
  svg += `<line x1="${X(s.res)}" x2="${X(s.res)}" y1="${pad.t}" y2="${pad.t + ih}" stroke="#785a28" stroke-dasharray="3 4"/>`;

  series.forEach(se => {
    const d = se.pts.map((v, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    svg += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.key === 'now' ? 2.5 : 2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round"/>`;
  });
  // kropki w miejscu celu
  series.slice(1).forEach(se => {
    svg += `<circle cx="${X(s.res)}" cy="${Y(se.f(s.res))}" r="4.5" fill="${se.color}" stroke="#12161f" stroke-width="2"/>`;
  });

  svg += `<line class="xh" y1="${pad.t}" y2="${pad.t + ih}" stroke="#a09b8c" visibility="hidden"/>`;
  svg += `<rect class="hit" x="${pad.l}" y="${pad.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;

  const box = document.getElementById('chart');
  box.innerHTML = svg;

  // legenda
  const sw = se => `<i style="border-color:${se.color};${se.dash ? 'border-top-style:dashed' : ''}"></i>`;
  document.getElementById('legend').innerHTML = series.map(se =>
    `<span>${sw(se)}${se.icon ? `+${se.amount} ${ic(se.icon, 'sm')}` : se.label}</span>`).join('') +
    `<span style="margin-left:auto">${ic(m.res, 'sm')} celu →</span>`;

  // przedziały pancerza / MR, w których płaskie przebicie jest lepsze
  const dS = series[2], fS = series[3];
  const ranges = []; let start = null;
  xs.forEach((r, i) => {
    const better = fS.pts[i] > dS.pts[i] + 1e-9;
    if (better && start === null) start = r;
    if (!better && start !== null) { ranges.push([start, xs[i - 1]]); start = null; }
  });
  if (start !== null) ranges.push([start, null]);
  const rtxt = ([a, b]) => b === null ? `<b>${a}+</b>` : `<b>${a}–${b}</b>`;
  document.getElementById('cross').innerHTML = ranges.length === 0
    ? `${ic(m.dmg, 'sm')} lepsze przy każdym ${ic(m.res, 'sm')}`
    : `${ic(m.flat, 'sm')} lepsze od ${ic(m.dmg, 'sm')}, gdy cel ma ${ranges.map(rtxt).join(', ')} ${ic(m.res, 'sm')}`;

  // hover
  const el = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = el.querySelector('.xh');
  el.querySelector('.hit').addEventListener('pointermove', e => {
    const rc = el.getBoundingClientRect();
    const px = (e.clientX - rc.left) * (W / rc.width);
    const i = Math.round(Math.min(1, Math.max(0, (px - pad.l) / iw)) * (xs.length - 1));
    xh.setAttribute('x1', X(xs[i])); xh.setAttribute('x2', X(xs[i])); xh.setAttribute('visibility', 'visible');
    tip.innerHTML = `<div class="r" style="color:var(--gold)">${SHORT[m.res]}: ${xs[i]}</div>` +
      series.slice().reverse().map(se => `<div class="r">${sw(se)}${se.icon ? '+' + se.amount + ' ' + SHORT[se.icon] : se.label}: <b>${nf0.format(se.pts[i])}</b></div>`).join('');
    tip.style.display = 'block';
    const bx = box.getBoundingClientRect();
    let left = e.clientX - bx.left + 14;
    if (left + tip.offsetWidth > bx.width) left = e.clientX - bx.left - tip.offsetWidth - 14;
    tip.style.left = left + 'px';
    tip.style.top = Math.max(0, e.clientY - bx.top - tip.offsetHeight - 10) + 'px';
  });
  el.querySelector('.hit').addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); });
}
function niceStep(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p;
  return 10 * p;
}

/* =====================================================================
   USTAWIENIA KOWADEŁ
   ===================================================================== */
function buildAnvilSettings() {
  const keys = ['ad', 'leth', 'ap', 'mpen', 'hp', 'armor', 'mr'];
  let h = `<span></span><span class="h">Szare</span><span class="h">Złote</span>`;
  keys.forEach(k => {
    h += `<span>${ic(k, 'sm')}</span>` + ['silver', 'gold'].map(t =>
      `<input type="number" step="1" min="0" value="${ANVIL[t][k]}" data-t="${t}" data-k="${k}">`).join('');
  });
  const box = document.getElementById('anv');
  box.innerHTML = h;
  box.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    if (v >= 0) { ANVIL[inp.dataset.t][inp.dataset.k] = v; render(); }
  }));
}

/* =====================================================================
   START
   ===================================================================== */
document.querySelectorAll('#seg-mode button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.v)));
document.querySelectorAll('#seg-tier button').forEach(b => b.addEventListener('click', () => { state.tier = b.dataset.v; syncSeg(); render(); }));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
syncSeg();
buildRows();
buildAnvilSettings();
render();
</script>
